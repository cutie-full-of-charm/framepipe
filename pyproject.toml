[project]
name = "framepipe"
version = "0.4.2.dev5"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "numpy",
]

keywords = [
    "video",
    "video-decoding",
    "video-processing",
    "hardware-acceleration",
    "ffmpeg",
    "vaapi",
    "cuda",
    "opencl",
    "computer-vision",
    "machine-learning",
    "real-time",
    "edge-inference",
    "gpu",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/cutie-full-of-charm/framepipe"
Repository = "https://github.com/cutie-full-of-charm/framepipe"
Issues = "https://github.com/cutie-full-of-charm/framepipe/issues"

[build-system]
requires = ["setuptools", "wheel", "nanobind"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["wheel", "psutil", "ruff", "setuptools", "nanobind", "build"]
test = [
    "loguru",
    "pytest",
    "requests",
    "tqdm",
    "pytest-repeat",
    "av",
    "nprof>=0.6.1",
]
examples = ["torch", "torchvision", "opencv-python"]

[tool.scikit-build]
cmake.build-type = "Release"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.format]
line-ending = "auto"
docstring-code-format = false
quote-style = "double"

[tool.ruff.lint]
select = ["I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["framepipe*"]

[tool.setuptools.package-data]
framepipe = ["*.pyd", "*.dll", "*.so", "*.pyi"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }

[tool.cibuildwheel]
build = "cp314-manylinux_x86_64"
skip = "*-musllinux*"
archs = ["x86_64"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"

[tool.pytest.ini_options]
testpaths = ["tests"]
